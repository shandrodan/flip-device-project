<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Device Prototype</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
:root {
  --page-bg: #f5f5f7; --page-fg: #1d1d1f; --page-muted: #6e6e73; --page-chip: rgba(0,0,0,0.06); --page-line: rgba(0,0,0,0.08);
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --sys-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  --rounded: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #000; --page-fg: #f5f5f7; --page-muted: #86868b; --page-chip: rgba(255,255,255,0.09); --page-line: rgba(255,255,255,0.1); }
}
:root[data-theme="dark"] { --page-bg: #000; --page-fg: #f5f5f7; --page-muted: #86868b; --page-chip: rgba(255,255,255,0.09); --page-line: rgba(255,255,255,0.1); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page-bg); color: var(--page-fg); font: 15px/1.47 var(--sys); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.page { max-width: 1000px; margin: 0 auto; padding: 32px 16px 80px; }
.page h1 { font: 700 30px/1.1 var(--sys-display); letter-spacing: -0.022em; margin: 0 0 6px; }
.page > p { margin: 0 0 22px; color: var(--page-muted); text-wrap: pretty; }
.panel { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pbtn { border: 0; border-radius: 999px; padding: 8px 14px; background: var(--page-chip); font-size: 14px; font-weight: 500; transition: transform 100ms ease-out; touch-action: none; user-select: none; }
.pbtn:active { transform: scale(0.96); }
.pbtn[aria-pressed="true"] { background: var(--page-fg); color: var(--page-bg); }
.keys { margin-top: 12px; color: var(--page-muted); font-size: 13px; }
kbd { font: 600 12px var(--sys); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--page-line); }

/* ---------- Device shell (Figma frame 1:5) ---------- */
.fit { width: 100%; max-width: 904px; margin: 0 auto; }
.device { position: relative; width: 904px; height: 600px; transform-origin: 0 0; }
.bezel { position: absolute; left: 0; top: 0; width: 900px; height: 600px; border-radius: 34px;
  background: linear-gradient(180deg, #f8f8f8 0%, #e6e6e6 100%); border: 1px solid #d4d4d4;
  box-shadow: 0 1px 0 #fff inset, 0 30px 60px -30px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.08); }
.glass { position: absolute; left: 50px; top: 40px; width: 800px; height: 520px; background: #000; border-radius: 24px; padding: 8px; }
.screen { position: relative; width: 784px; height: 504px; border-radius: 16px; overflow: hidden; background: #000; color: #f5f5f7;
  font-family: var(--sys); -webkit-font-smoothing: antialiased; isolation: isolate; user-select: none; }
.side { position: absolute; left: 900px; top: 459px; width: 4px; height: 96px; padding: 0; border: 0; border-radius: 0 3px 3px 0;
  background: linear-gradient(90deg, #cfcfcf, #e2e2e2); box-shadow: 1px 0 0 #bdbdbd; touch-action: none; }
.side::before { content: ""; position: absolute; inset: -8px -16px -8px -10px; }
.side.down { transform: translateX(-2px); background: #bdbdbd; }
.side:focus-visible { outline: 2px solid #0a84ff; outline-offset: 4px; }
.side.want::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: #ff6a00; animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.25; } }

/* ---------- App ---------- */
.fill { position: absolute; inset: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.in { animation: materialize 420ms var(--ease) both; }
.in-2 { animation-delay: 50ms; } .in-3 { animation-delay: 100ms; } .in-4 { animation-delay: 150ms; }
@keyframes materialize { from { opacity: 0; transform: translateY(8px) scale(0.99); filter: blur(5px); } }
.status { position: absolute; top: 0; left: 0; right: 0; height: 34px; padding: 0 20px 0 24px; display: flex; align-items: center; justify-content: space-between;
  font: 600 13px/1 var(--sys); color: var(--ink, #fff); z-index: 25; pointer-events: none; transition: color 300ms ease; }
.status span { display: inline-flex; align-items: center; gap: 8px; }
.batt { width: 22px; height: 11px; border: 1px solid currentColor; border-radius: 3.5px; padding: 1px; opacity: 0.85; }
.batt i { display: block; height: 100%; width: 82%; background: currentColor; border-radius: 2px; }
.batt.charge i { background: #34d17a; }
.rail { position: absolute; left: 0; top: 0; bottom: 0; width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 42px 0 14px; z-index: 6; }
.rail button { width: 46px; height: 46px; border-radius: 15px; border: 0; background: transparent; color: rgba(235,235,245,0.45); display: grid; place-items: center;
  transition: background-color 200ms ease, color 200ms ease, transform 100ms ease-out; position: relative; }
.rail button.on { background: rgba(255,255,255,0.12); color: #fff; }
.rail button:active { transform: scale(0.93); }
.rail .badge { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: #ff6a00; }
.rail .grow { flex: 1; }
.main { position: absolute; left: 72px; right: 0; top: 0; bottom: 0; overflow: hidden; }
.main.full { left: 0; }
.scr { position: absolute; inset: 0; padding: 44px 28px 22px 14px; }
.scroll { overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { display: none; }
.h1 { font: 600 28px/1.1 var(--sys-display); letter-spacing: -0.024em; margin: 0; }
.say { font: 600 32px/1.12 var(--sys-display); letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
.mute { color: rgba(235,235,245,0.58); }
.label { font: 600 12px/1.2 var(--sys); color: rgba(235,235,245,0.58); }
.btn { border: 0; border-radius: 999px; padding: 11px 18px; font: 600 15px/1 var(--sys); letter-spacing: -0.01em; background: #fff; color: #000;
  transition: transform 100ms ease-out, opacity 150ms ease; white-space: nowrap; }
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.ghost { background: rgba(255,255,255,0.1); color: #fff; }
.btn.sm { padding: 7px 12px; font-size: 13px; }
.btn.danger { background: rgba(255,106,0,0.14); color: #ff9a4d; }
.link { border: 0; background: none; padding: 0; color: #fff; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(255,255,255,0.35); }
.back { border: 0; background: none; padding: 4px 0; color: rgba(235,235,245,0.6); font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.card { border-radius: 20px; background: #111113; padding: 14px 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--sys); padding: 5px 9px; border-radius: 999px; background: rgba(255,255,255,0.08); color: rgba(235,235,245,0.75); white-space: nowrap; }
.chip.warn { background: rgba(255,106,0,0.16); color: #ff9a4d; }
.chip.ok { background: rgba(52,209,122,0.16); color: #7fe0a8; }
.chip.blue { background: rgba(74,157,255,0.16); color: #8cc4ff; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.row { display: flex; gap: 12px; align-items: center; padding: 11px 4px; border-top: 0.5px solid rgba(255,255,255,0.1); }
.row.tap { border-radius: 12px; transition: background-color 150ms ease; cursor: pointer; }
.row.tap:hover { background: rgba(255,255,255,0.04); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3); flex: none; display: grid; place-items: center; color: #000; background: none; padding: 0; transition: transform 100ms ease-out; }
.check:active { transform: scale(0.9); }
.check.on { background: #fff; border-color: #fff; }
.field { width: 100%; background: #1c1c1e; border: 0; border-radius: 12px; padding: 10px 12px; color: #fff; outline: none; font-size: 15px; user-select: text; }
.field:focus { box-shadow: 0 0 0 2px rgba(255,255,255,0.5); }
.seg { display: flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,0.08); }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 9px; font-size: 13.5px; font-weight: 500; color: rgba(235,235,245,0.6); transition: background-color 200ms ease, color 200ms ease; }
.seg button.on { background: #2c2c2e; color: #fff; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; font-size: 15px; }
.set-row + .set-row { border-top: 0.5px solid rgba(255,255,255,0.1); }
.switch { width: 44px; height: 26px; border-radius: 13px; border: 0; padding: 2px; background: rgba(255,255,255,0.18); transition: background-color 200ms ease; flex: none; }
.switch i { display: block; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 250ms var(--ease); }
.switch.on { background: #34d17a; }
.switch.on i { transform: translateX(18px); }
.perm { border-radius: 18px; background: #111113; padding: 14px; display: flex; flex-direction: column; gap: 6px; border: 2px solid transparent; text-align: left; color: #fff; transition: border-color 200ms ease, opacity 200ms ease; }
.perm.on { border-color: #fff; }
.perm:disabled { opacity: 0.4; cursor: default; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; transition: transform 100ms ease-out; box-shadow: 0 0 0 0 #fff; }
.swatch.on { box-shadow: 0 0 0 3px #000, 0 0 0 5px #fff; }
.swatch:active { transform: scale(0.9); }
.shape-pick { border: 0; background: #111113; border-radius: 16px; padding: 4px; display: grid; place-items: center; transition: background-color 150ms ease; }
.shape-pick.on { background: #2c2c2e; box-shadow: inset 0 0 0 2px #fff; }
.agent-card { border: 0; text-align: left; color: #fff; background: #111113; border-radius: 22px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 2px; transition: background-color 150ms ease, transform 100ms ease-out; }
.agent-card:hover { background: #18181a; }
.agent-card:active { transform: scale(0.98); }
.agent-card.new { background: none; border: 1.5px dashed rgba(255,255,255,0.22); align-items: center; justify-content: center; text-align: center; }
.talk-pill { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; padding: 12px 20px; background: #fff; color: #000; font-weight: 600; touch-action: none; transition: transform 120ms ease-out; }
.talk-pill:active { transform: scale(0.96); }
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 40; background: #2c2c2e; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; animation: toastIn 420ms var(--ease) both; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } }
.soft { position: absolute; left: 86px; right: 20px; bottom: 16px; z-index: 12; display: flex; align-items: center; gap: 14px; background: #1c1c1e; border-radius: 22px; padding: 12px 16px; animation: materialize 420ms var(--ease) both; }
.press-bar { position: absolute; right: 0; top: 406px; height: 98px; width: 5px; border-radius: 4px 0 0 4px; background: #000; animation: breathe 1.4s ease-in-out infinite; z-index: 3; }
.press-bar.light { background: #fff; }

/* ---------- Fire (approval) ---------- */
.fire-layer { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.fire-layer.live { pointer-events: auto; }
.fire { position: absolute; inset: 0; overflow: hidden; opacity: 0;
  transition: clip-path 650ms var(--ease), opacity 180ms ease 470ms;
  background:
    radial-gradient(55% 60% at 18% 85%, #ff2d00 0%, transparent 70%),
    radial-gradient(50% 55% at 88% 12%, #ffb300 0%, transparent 70%),
    radial-gradient(60% 55% at 62% 105%, #ff4800 0%, transparent 70%),
    radial-gradient(45% 50% at 40% 20%, #ff9a1a 0%, transparent 70%),
    linear-gradient(to top, #ff5200, #ff8c1a); }
.fire.on { opacity: 1; transition: clip-path 650ms var(--ease), opacity 60ms ease; }
.fire i { position: absolute; bottom: -150px; width: 280px; height: 280px; border-radius: 50%; filter: blur(55px); opacity: 0.7; animation: flame 3.4s ease-in-out infinite alternate; }
@keyframes flame { to { transform: translateY(-130px) scale(1.2); opacity: 0.3; } }
.fire-copy { position: absolute; left: 40px; top: 0; bottom: 0; width: 440px; display: flex; flex-direction: column; justify-content: center; color: #000; }
.fire-copy .mute { color: rgba(0,0,0,0.66); }
.fire-copy .btn.ghost { background: rgba(0,0,0,0.12); color: #000; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  .in { filter: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
/*
 * Device prototype. Everything runs in the page: the "server" (task agents, transcription)
 * is simulated so the UI can be tried end to end. Real device <-> server traffic belongs in
 * packages/protocol.
 *
 * Bot rendering techniques (radial-profile morphing, eyes as mask holes, ease-outs from the
 * frozen pose, deterministic blinks and gaze drift, 3D orbit rings) are adapted from
 * bloub by Norbert Bodziony, MIT licence: https://github.com/NorbertBodziony/bloub
 * Shapes, expressions, colours and the budding animation here are our own.
 */
const { useState, useEffect, useRef, useReducer, useMemo, useCallback } = React;

/* =========================== Math =========================== */
const N = 64, TAU = Math.PI * 2;
const ANG = Array.from({ length: N }, (_, i) => (i / N) * TAU), COS = ANG.map(Math.cos), SIN = ANG.map(Math.sin);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const easeOutQuint = t => 1 - Math.pow(1 - t, 5);
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function mulberry(seed) {

  return () => { a = (a + 0x6d2b79f5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const loopNoise = (t, p, s = 0) => { const x = (t / p) * TAU; return 0.55 * Math.sin(x + s) + 0.3 * Math.sin(2 * x + s * 1.7 + 1.1) + 0.15 * Math.sin(3 * x + s * 2.3 + 2.4); };

/* =========================== Shapes: radial profiles on 64 shared angles =========================== */
const norm = (r, max = 1) => { const p = Math.max(...r); return r.map(x => (x * max) / p); };

    let best = 0;

const chain = (x1, y1, r1, x2, y2, r2, n = 24) => Array.from({ length: n + 1 }, (_, i) => ({ x: lerp(x1, x2, i / n), y: lerp(y1, y2, i / n), r: lerp(r1, r2, i / n) }));

  circle: Array(N).fill(1),
  squircle: norm(ANG.map(a => Math.pow(Math.pow(Math.abs(Math.cos(a)), 4) + Math.pow(Math.abs(Math.sin(a)), 4), -1 / 4)), 1.1),
  capsule: norm(unionCircles(chain(-0.42, 0, 0.6, 0.42, 0, 0.6)), 1.08),
  pebble: norm(ANG.map(a => 1 + 0.075 * Math.cos(2 * a + 0.5) + 0.035 * Math.cos(3 * a + 2.1)), 1.02),
  cloud: norm(unionCircles([{ x: -0.46, y: 0.18, r: 0.52 }, { x: 0.46, y: 0.18, r: 0.52 }, { x: 0, y: 0.26, r: 0.6 }, { x: -0.22, y: -0.27, r: 0.5 }, { x: 0.3, y: -0.2, r: 0.45 }]), 1.06),
  drop: norm(unionCircles(chain(0, 0.26, 0.66, 0, -0.92, 0.08)), 1.06),
  hexagon: norm(regPoly(6, -90, 3), 1.06),
  triangle: norm(regPoly(3, -90, 6), 1.16),

const SHAPE_KEYS = Object.keys(SHAPES);
const EYE_DY = { triangle: 0.2, drop: 0.14, cloud: 0.04, flower: 0.02 };

    d += `C${f(p1.x + (p2.x - p0.x) / 6)} ${f(p1.y + (p2.y - p0.y) / 6)} ${f(p2.x - (p3.x - p1.x) / 6)} ${f(p2.y - (p3.y - p1.y) / 6)} ${f(p2.x)} ${f(p2.y)}`;

/* =========================== Expressions =========================== */
const E0 = { lx: -0.2, ly: -0.12, rx: 0.2, ry: -0.12, w: 0.15, h: 0.34, tL: -8, tR: -8, lidL: 1, lidR: 1, cL: 0, cR: 0 };
function statePose(s, tl, radii, shapeKey) {
  const p = { radii, rot: 0, sx: 1, sy: 1, cx: 0, cy: 0, ring: 0, zz: 0, wob: 0, eyes: { ...E0 } }, e = p.eyes;
  switch (s) {
    case "listen": e.h = 0.4; e.w = 0.16; p.wob = 1; break;
    case "think": e.lx -= 0.08; e.rx -= 0.08; e.ly -= 0.08; e.ry -= 0.08; e.h = 0.3; p.ring = 1; break;
    case "happy": e.cL = e.cR = 1; e.ly = e.ry = -0.16; p.cy = -0.1 * Math.sin(Math.PI * clamp(tl / 0.38)); break;
    case "wink": e.cR = 1; break;
    case "sad": e.ly = e.ry = -0.03; e.h = 0.26; e.tL = -20; e.tR = 20; e.lx = -0.22; e.rx = 0.22; p.sy = 0.95; p.sx = 1.03; p.cy = 0.03; break;
    case "sleep": e.lidL = e.lidR = 0.1; e.ly = e.ry = -0.04; p.zz = 1; break;
    case "focus": e.lidL = e.lidR = 0.1; e.ly = e.ry = -0.04; break;
    case "warn": e.h = 0.4; e.w = 0.17; e.lx += 0.06; e.rx += 0.06; e.ly += 0.05; e.ry += 0.05; break;
    case "wide": e.w = 0.2; e.h = 0.2; e.ly = e.ry = -0.14; break;

  const dy = EYE_DY[shapeKey] || 0; e.ly += dy; e.ry += dy;

}
function blendPose(a, b, k) {
  const e = {};
  for (const key in b.eyes) e[key] = lerp(a.eyes[key], b.eyes[key], k);
  return { radii: b.radii.map((r, i) => lerp(a.radii[i], r, k)), rot: lerp(a.rot, b.rot, k), sx: lerp(a.sx, b.sx, k), sy: lerp(a.sy, b.sy, k),
    cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k), ring: lerp(a.ring, b.ring, k), zz: lerp(a.zz, b.zz, k), wob: lerp(a.wob, b.wob, k), eyes: e };
}
function makeBlinks(seed) {
  const r = mulberry(seed * 7919 + 13), out = []; let t = 0.8 + r() * 2;
  while (t < 3600) { out.push(t); t += 2 + r() * 2.8; if (r() < 0.16) { out.push(t); t += 0.26; } }

}

    case "approve": {
      const ap = s.approval; if (!ap) return s;
      let n = { ...s, approval: null, lastHappy: Date.now() };
      if (ap.kind === "task") {
        const t = s.tasks.find(x => x.id === ap.taskId);
        n = upd(n, t.id, { status: "running", nextAt: Date.now() + 500, steps: t.steps.map((x, i) => (i === t.step ? { ...x, approved: true } : x)) });
      }
      if (ap.kind === "deleteNote") n = { ...n, notes: n.notes.filter(x => x.id !== ap.noteId), route: "notes", toast: "Note deleted" };
      if (ap.kind === "deleteAgent") {
        const ag = agentById(s, ap.agentId);
        n = { ...n, agents: n.agents.filter(x => x.id !== ap.agentId), tasks: n.tasks.map(t => (t.agentId === ap.agentId && t.status !== "done" ? { ...t, agentId: null, status: "todo" } : t)),
          route: "agents", toast: `${ag.name} deleted` };
      }
      return n;
    }
    case "decline": {
      const ap = s.approval; if (!ap) return s;
      let n = { ...s, approval: null };
      if (ap.kind === "task") n = log(upd(n, ap.taskId, { status: "held" }), ap.agentId, "Waiting until you’re ready");
      return n;
    }
    case "resume": return upd(s, a.id, { status: "running", nextAt: Date.now() + 300 });
    case "editNote": return { ...s, notes: s.notes.map(x => (x.id === a.id ? { ...x, text: a.text, edited: true } : x)) };
    case "askDeleteNote": return { ...s, approval: { id: uid("ap"), kind: "deleteNote", noteId: a.id, agentId: "main", fire: true, title: "Delete this note?", body: "You can’t undo this. Deleting always needs your press." } };
    case "askDeleteAgent": {
      const ag = agentById(s, a.id);
      return { ...s, approval: { id: uid("ap"), kind: "deleteAgent", agentId: a.id, fire: true, title: `Delete ${ag.name}?`, body: "Its open tasks move back to your list. Deleting always needs your press." } };
    }
    case "createAgent": {
      const id = uid("a");
      return log({ ...s, agents: [...s.agents, { ...a.agent, id, builtin: false, seed: 40 + s.agents.length * 17 }], route: "agent:" + id, freshAgent: id, lastHappy: Date.now() }, "main", `Made ${a.agent.name}`);
    }
    case "settings": return { ...s, settings: { ...s.settings, ...a.patch } };
    case "device": return { ...s, settings: { ...s.settings, devices: s.settings.devices.map(d => (d.id === a.id ? { ...d, online: !d.online } : d)) } };
    case "addDevice": return { ...s, settings: { ...s.settings, devices: [...s.settings.devices, { id: uid("d"), name: "New machine", online: false, pending: true }] }, toast: "Install the PC agent there and sign in to Tailscale" };
    case "online": {
      if (a.value === s.online) return s;
      if (!a.value) return { ...s, online: false, toast: "Offline. Notes still work." };
      const local = s.notes.filter(x => x.source === "local");
      const fixed = local.filter(x => !x.edited);
      const notes = s.notes.map(x => (x.source === "local" && !x.edited ? { ...x, source: "cloud" } : x));
      return { ...s, online: true, notes, toast: fixed.length ? `Back online. Re-checked ${fixed.length} note${fixed.length > 1 ? "s" : ""} with the cloud` : "Back online" };
    }
    case "dock": return { ...s, docked: a.value, route: a.value ? s.route : s.route };
    case "speed": return { ...s, speed: a.value };
    case "focus": {
      const f = s.focus;
      if (a.op === "toggle") return { ...s, focus: { ...f, running: !f.running } };
      if (a.op === "reset") return { ...s, focus: { ...f, running: false, remaining: f.len } };
      if (a.op === "len") return { ...s, focus: { ...f, len: a.ms, remaining: a.ms, running: false } };
      return s;
    }
    case "limits": return { ...s, limitsBack: false, limitsAt: s.vclock + 5 * 3600e3 };
    case "toast": return { ...s, toast: a.msg };
    case "reset": { try { localStorage.removeItem(STORE); } catch (e) {} return { ...load(), toast: "Demo reset" }; }
    default: return s;
  }
}

  arrow: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 8h10M9 4l4 4-4 4" /></svg>,

  clip: <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M10.5 4.5 5.8 9.2a1.5 1.5 0 0 0 2.1 2.1l5-5a3 3 0 0 0-4.2-4.2l-5 5a4.5 4.5 0 0 0 6.4 6.4l4-4" /></svg>,
};
const ago = at => { const m = Math.round((Date.now() - at) / 6e4); return m < 1 ? "now" : m < 60 ? `${m}m` : m < 24 * 60 ? `${Math.round(m / 60)}h` : m < 48 * 60 ? "Yesterday" : `${Math.round(m / 1440)}d`; };
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const AgentBot = ({ agent, size, state = "idle", fps, morphFrom }) => <Bot shape={agent.shape} color={agent.color} seed={agent.seed} size={size} state={state} fps={fps || (size < 90 ? 30 : 60)} morphFrom={morphFrom} />;
const statusChip = (t, agents) => {
  const ag = agents.find(a => a.id === t.agentId), who = ag ? ag.name : "You";
  if (t.status === "done") return <span className="chip ok">{ag ? who + " · done" : "Done"}</span>;
  if (t.status === "running") return <span className="chip blue"><i className="dot" />{who} · working</span>;
  if (t.status === "waiting" || t.status === "held") return <span className="chip warn"><i className="dot" />{who} · waiting for your press</span>;
  if (t.status === "paused") return <span className="chip"><i className="dot" />{who} · can’t reach MacBook</span>;
  return <span className="chip">{who}</span>;
};
const moodFor = t => ({ running: "think", waiting: "warn", held: "idle", paused: "sad", done: "happy" }[t.status] || "idle");

/* =========================== Screens =========================== */
function Home({ s, d, startTalk, stopTalk }) {
  const running = s.tasks.filter(t => t.status === "running"), waiting = s.tasks.filter(t => t.status === "held" || t.status === "paused");
  const happy = Date.now() - s.lastHappy < 2500;
  const state = happy ? "happy" : running.length ? "think" : waiting.length ? "wide" : "idle";
  const first = running[0], ag = first && agentById(s, first.agentId);
  const active = s.tasks.filter(t => ["running", "held", "paused", "waiting"].includes(t.status) && t.agentId);
  return <div className="scr">
    <div style={{ position: "absolute", left: 0, right: 0, top: 34, display: "grid", placeItems: "center" }}><Bot state={state} size={220} seed={3} /></div>
    <div className="in" style={{ position: "absolute", left: 0, right: 0, bottom: 30, textAlign: "center", padding: "0 24px" }}>
      <p className="say" style={{ fontSize: 26 }}>{first ? `${ag.name} is on it: ${first.title.toLowerCase()}` : waiting.length ? `${waiting.length} task${waiting.length > 1 ? "s" : ""} need${waiting.length > 1 ? "" : "s"} you` : "Hold Talk and just say it."}</p>
      <div style={{ display: "flex", gap: 12, justifyContent: "center", alignItems: "center", marginTop: 16 }}>
        <button className="talk-pill" onPointerDown={e => { e.currentTarget.setPointerCapture(e.pointerId); startTalk(); }} onPointerUp={stopTalk} onPointerCancel={stopTalk}>{Ico.mic} Hold to talk</button>
        {active.length > 0 && <div style={{ display: "flex", gap: 4 }}>{active.slice(0, 4).map(t => <button key={t.id} title={t.title} onClick={() => d({ type: "nav", route: "task:" + t.id })}
          style={{ border: 0, background: "none", padding: 0 }}><AgentBot agent={agentById(s, t.agentId)} size={40} state={moodFor(t)} /></button>)}</div>}
      </div>
    </div>
  </div>;
}

function TalkOverlay({ s }) {
  const [, force] = useState(0);
  const [level, setLevel] = useState(0.6);
  useEffect(() => { const id = setInterval(() => { force(x => x + 1); setLevel(0.35 + Math.random() * 0.65); }, 90); return () => clearInterval(id); }, []);
  const words = SAMPLES[s.talk.sample].text.split(" "), n = Math.min(words.length, Math.floor((Date.now() - s.talk.start) / WORD_MS));
  return <div className="fill" style={{ background: "#000", zIndex: 15 }}>
    <div style={{ position: "absolute", left: 60, top: 92 }}><Bot state="listen" level={level} size={320} seed={3} /></div>
    <div style={{ position: "absolute", left: 420, top: 110, right: 40 }}>
      <div className="label" style={{ fontSize: 14 }}>{s.online ? "Listening" : "Listening · on device"}</div>
      <p style={{ margin: "10px 0 0", font: "500 25px/1.32 var(--sys-display)", letterSpacing: "-0.02em" }}>{words.slice(0, Math.max(1, n)).join(" ")}<span style={{ opacity: 0.35 }}>{n < words.length ? " …" : ""}</span></p>
      {!s.online && <p className="mute" style={{ fontSize: 14, marginTop: 18 }}>No connection. Saved on the Device, re-checked with the cloud later.</p>}
    </div>
    <span className="label" style={{ position: "absolute", left: 420, bottom: 30 }}>Let go to save</span>
  </div>;
}

function Suggest({ s, d, id }) {
  const note = s.notes.find(n => n.id === id);
  const [picks, setPicks] = useState(() => (note ? note.suggestions.map((_, i) => i) : []));
  if (!note) return null;
  const none = !note.suggestions.length;
  return <div className="scr">
    <div style={{ position: "absolute", left: 30, top: 70 }}><Bot state={none ? "idle" : "happy"} size={150} seed={3} /></div>
    <div style={{ position: "absolute", left: 210, right: 30, top: 58 }}>
      <p className="say in" style={{ fontSize: 30 }}>{!s.online && none ? "Saved on the Device." : none ? "Saved." : `Saved. I hear ${note.suggestions.length === 1 ? "one task" : note.suggestions.length + " tasks"}.`}</p>
      <p className="mute in in-2" style={{ margin: "8px 0 16px", fontSize: 14.5, lineHeight: 1.45, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>“{note.text}”</p>
      {!none && <div className="in in-3" style={{ display: "grid", gap: 8 }}>
        {note.suggestions.map((sg, i) => {
          const agId = resolveAgent(s, sg.agent), ag = agId && agentById(s, agId), missing = sg.agent && ag && ag.purpose !== sg.agent, on = picks.includes(i);
          return <div key={i} className="card" style={{ display: "flex", gap: 12, alignItems: "center", padding: "10px 14px" }}>
            <button className={"check" + (on ? " on" : "")} aria-label="Include" onClick={() => setPicks(p => (on ? p.filter(x => x !== i) : [...p, i]))}>{on && Ico.check()}</button>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 600 }}>{sg.title}</div>
              <div className="mute" style={{ fontSize: 13 }}>{ag ? (missing ? <>No {PURPOSES[sg.agent] ? PURPOSES[sg.agent].name : "agent"} yet, so I’ll do it. <button className="link" onClick={() => d({ type: "nav", route: "create" })}>Make one</button></> : ag.name + (sg.template === "sendDeck" ? ", asks before it sends" : sg.template === "cleanScreens" ? ", asks before it deletes" : "")) : "A plain todo"}</div>
            </div>
            {ag && <AgentBot agent={ag} size={40} />}
          </div>;
        })}
      </div>}
      <div className="in in-4" style={{ display: "flex", gap: 10, marginTop: 16 }}>
        {none ? <button className="btn" onClick={() => d({ type: "dismissNote", noteId: note.id })}>OK</button> : <>
          <button className="btn" disabled={!picks.length} onClick={() => d({ type: "accept", noteId: note.id, picks })}>Do it</button>
          <button className="btn ghost" onClick={() => d({ type: "accept", noteId: note.id, picks, asTodos: true })}>Keep as todos</button>
          <button className="btn ghost" onClick={() => d({ type: "dismissNote", noteId: note.id })}>Just the note</button></>}
      </div>
    </div>
  </div>;
}

function TaskView({ s, d, id }) {
  const t = s.tasks.find(x => x.id === id);
  if (!t) return <div className="scr"><p className="say">That task is gone.</p></div>;
  const ag = agentById(s, t.agentId);
  return <div className="scr">
    <button className="back" onClick={() => d({ type: "back" })}>{Ico.chev} Tasks</button>
    {ag && <div style={{ position: "absolute", left: 24, top: 110 }}><AgentBot agent={ag} size={230} state={moodFor(t)} /></div>}
    <div style={{ position: "absolute", left: ag ? 300 : 30, right: 30, top: 66 }}>
      <div className="label in" style={{ fontSize: 13 }}>{ag ? ag.name : "Todo"} {!s.online && t.status === "running" ? "· waiting for connection" : ""}</div>
      <p className="say in" style={{ fontSize: 28, marginTop: 4 }}>{t.title}</p>
      <div className="in in-2" style={{ marginTop: 14 }}>
        {t.steps.map((st, i) => {
          const done = st.done, now = i === t.step && t.status !== "done";
          return <div key={i} style={{ display: "flex", gap: 10, alignItems: "center", padding: "6px 0", fontSize: 15, color: done ? "rgba(235,235,245,0.7)" : now ? (st.risky ? "#ff9a4d" : "#fff") : "rgba(235,235,245,0.35)" }}>
            <span className={"check" + (done ? " on" : "")} style={{ width: 18, height: 18, borderColor: now ? "currentColor" : undefined }}>{done && Ico.check(10)}</span>{st.t}
            {now && st.risky && <span className="chip warn" style={{ marginLeft: "auto" }}>asks first</span>}
          </div>;
        })}
        {!t.steps.length && <p className="mute">A plain todo. Hand it to an agent from Tasks.</p>}
      </div>
      <div className="in in-3" style={{ display: "flex", gap: 10, marginTop: 18, alignItems: "center" }}>
        {t.status === "held" && <><button className="btn" onClick={() => d({ type: "resume", id: t.id })}>Review again</button><span className="mute" style={{ fontSize: 14 }}>Waiting until you’re ready</span></>}
        {t.status === "paused" && <><button className="btn" onClick={() => d({ type: "resume", id: t.id })}>Try again</button><span className="mute" style={{ fontSize: 14 }}>MacBook is offline on Tailscale</span></>}
        {t.status === "done" && <button className="btn ghost" onClick={() => d({ type: "nav", route: "home" })}>Back home</button>}

    </div>
  </div>;
}

function Notes({ s, d }) {

      {n.edited && <span className="chip">Edited, your version is kept</span>}

function Agents({ s, d }) {

      })}

        <span style={{ color: "rgba(255,255,255,0.7)" }}>{Ico.plus}</span><b style={{ fontSize: 15 }}>New agent</b><span className="mute" style={{ fontSize: 12.5 }}>Made by your main agent</span>
      </button>
    </div>
  </div>;
}

function AgentView({ s, d, id }) {
  const a = agentById(s, id);
  if (!a) return null;
  const work = s.tasks.find(t => t.agentId === a.id && ["running", "waiting", "held", "paused"].includes(t.status));
  const done = s.tasks.filter(t => t.agentId === a.id && t.status === "done").length;
  const acts = s.activity.filter(x => x.agentId === a.id).slice(0, 4);
  const fresh = s.freshAgent === a.id;
  const asks = s.settings.mode === "manual" ? ["Every step"] : s.settings.mode === "full" ? ["Nothing, Full mode is on"] : ["Send", "Delete", "Pay", "Leaving your machines"];
  return <div className="scr">
    <button className="back" onClick={() => d({ type: "back" })}>{Ico.chev} Agents</button>
    <div style={{ position: "absolute", left: 24, top: 104 }}><AgentBot agent={a} size={240} state={fresh && Date.now() - s.lastHappy < 2500 ? "happy" : work ? moodFor(work) : "idle"} morphFrom={fresh ? "circle" : undefined} /></div>
    <div style={{ position: "absolute", left: 300, right: 30, top: 66 }}>

      <p className="mute in" style={{ margin: "6px 0 14px", fontSize: 15 }}>{a.role}</p>

      <div className="in in-3" style={{ marginTop: 16 }}>

        {work && <div className="row tap" onClick={() => d({ type: "nav", route: "task:" + work.id })}><span style={{ flex: 1 }}>{work.title}</span>{statusChip(work, s.agents)}</div>}
        {acts.map((x, i) => <div key={i} style={{ display: "flex", gap: 10, fontSize: 14, padding: "5px 0" }}><span style={{ flex: 1 }}>{x.text}</span><span className="mute">{ago(x.at)}</span></div>)}

}

function Create({ s, d }) {

  if (step === 3) return <div className="fill"><BudScene color={color} onDone={finish} /><p className="say in" style={{ position: "absolute", left: 0, right: 0, bottom: 40, textAlign: "center", fontSize: 24 }}>Making {name.trim() || "your agent"}…</p></div>;

function Focus({ s, d }) {
  const f = s.focus, pct = f.remaining / f.len, r = 128, L = 2 * Math.PI * r;
  return <div className="scr">
    <svg width="290" height="290" style={{ position: "absolute", left: "50%", top: 40, marginLeft: -145, transform: "rotate(-90deg)" }}>
      <circle cx="145" cy="145" r={r} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="5" />
      <circle cx="145" cy="145" r={r} fill="none" stroke="#fff" strokeWidth="5" strokeLinecap="round" strokeDasharray={L} strokeDashoffset={L * (1 - pct)} style={{ transition: "stroke-dashoffset 300ms linear" }} />
    </svg>
    <div style={{ position: "absolute", left: "50%", top: 75, marginLeft: -110 }}><Bot size={220} seed={3} state={f.running ? "focus" : "idle"} /></div>
    <div style={{ position: "absolute", left: 0, right: 0, bottom: 26, textAlign: "center" }}>
      <div className="tnum" style={{ font: "600 56px/1 var(--rounded)", letterSpacing: "-0.03em" }}>{mmss(f.remaining)}</div>
      <div className="mute" style={{ fontSize: 14, margin: "6px 0 12px" }}>Round {f.round} · {f.running ? "I’ll hold everything that isn’t urgent" : "Ready when you are"}</div>
      <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
        <button className="btn" onClick={() => d({ type: "focus", op: "toggle" })}>{f.running ? "Pause" : "Start"}</button>
        <button className="btn ghost" onClick={() => d({ type: "focus", op: "reset" })}>Reset</button>
        <div className="seg" style={{ width: 180 }}>{[["Focus 25", 25], ["Break 5", 5]].map(([l, m]) => <button key={m} className={f.len === m * 60e3 ? "on" : ""} onClick={() => d({ type: "focus", op: "len", ms: m * 60e3 })}>{l}</button>)}</div>
      </div>
    </div>
  </div>;
}

function Dock({ s, d }) {
  const f = s.focus, left = Math.max(0, s.limitsAt - s.vclock);
  return <div className="fill" style={{ padding: "44px 18px 18px", display: "grid", gridTemplateColumns: "1.15fr 1fr", gridTemplateRows: "1fr 1fr", gap: 12 }}>

      <div style={{ position: "absolute", right: 10, top: 6 }}><Bot size={70} seed={3} state={f.running ? "sleep" : "idle"} fps={30} /></div>

      <div className="label">Today</div>

    </div>
    <div className="card in in-2" style={{ display: "flex", flexDirection: "column", justifyContent: "space-between" }}>

      {s.limitsBack ? <div style={{ display: "flex", alignItems: "center", gap: 10 }}><Bot size={56} seed={5} state="happy" fps={30} /><b style={{ fontSize: 26, letterSpacing: "-0.02em" }}>They’re back.</b></div>
        : <div className="tnum" style={{ font: "600 46px/1.1 var(--rounded)" }}>{Math.ceil(left / 6e4)} min</div>}

      {s.activity.slice(0, 4).map((x, i) => { const ag = agentById(s, x.agentId); return <div key={i} style={{ display: "flex", gap: 8, fontSize: 13.5, padding: "4px 0", alignItems: "center" }}>
        {ag && <AgentBot agent={ag} size={18} />}<span style={{ flex: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{x.text}</span><span className="mute">{ago(x.at)}</span></div>; })}

              <button key={k} className={"perm" + (st.mode === k ? " on" : "")} disabled={k === "full" && st.hosting === "cloud"} onClick={() => set({ mode: k })}>

          <div className="card" style={{ padding: "4px 14px" }}>
            {st.devices.map(dv => <div key={dv.id} className="set-row"><span>{dv.name}{dv.pending && <span className="mute" style={{ fontSize: 12 }}> · waiting for PC agent</span>}</span>
              <button className={"switch" + (dv.online ? " on" : "")} onClick={() => d({ type: "device", id: dv.id })} aria-label={dv.name + " online"}><i /></button></div>)}
            <div className="set-row"><button className="link" onClick={() => d({ type: "addDevice" })}>Add a machine</button></div>
          </div></div>

}

/* =========================== Overlays =========================== */
function FireOverlay({ s, d }) {
  const ap = s.approval && s.approval.fire ? s.approval : null;
  const [shown, setShown] = useState(null), [phase, setPhase] = useState("off");
  useEffect(() => {
    if (ap) { setShown(ap); setPhase("pre"); const r = requestAnimationFrame(() => requestAnimationFrame(() => setPhase("fire"))); return () => cancelAnimationFrame(r); }
    if (shown) { setPhase("done"); const t = setTimeout(() => { setShown(null); setPhase("off"); }, 720); return () => clearTimeout(t); }
  }, [ap && ap.id]);
  if (!shown) return null;
  const o = { x: 392, y: 220, r: 80 }, fire = phase === "fire";
  const clip = fire ? "circle(900px at 610px 250px)" : `circle(${o.r}px at ${o.x}px ${o.y}px)`;
  const ag = agentById(s, shown.agentId);
  return <div className={"fire-layer" + (fire ? " live" : "")}>
    <div className={"fire" + (fire ? " on" : "")} style={{ clipPath: clip, WebkitClipPath: clip }}>
      {[["-40px", "#ffcf33", "0s"], ["180px", "#ff2d00", "0.8s"], ["400px", "#ffb000", "1.6s"], ["600px", "#ff3d00", "0.4s"]].map(([l, b, dl], i) => <i key={i} style={{ left: l, background: b, animationDelay: dl }} />)}
    </div>
    {fire && <>
      <div style={{ position: "absolute", left: 470, top: 100 }}><Bot size={300} seed={ag ? ag.seed : 3} shape={ag ? ag.shape : "circle"} state="warn" eyesOnly /></div>
      <div className="fire-copy in" style={{ animationDelay: "160ms" }}>
        <div className="label" style={{ color: "rgba(0,0,0,0.6)", marginBottom: 8 }}>{ag ? ag.name : "Main agent"} needs your press</div>
        <p className="say" style={{ fontSize: 42 }}>{shown.title}</p>
        {shown.preview ? <div style={{ margin: "14px 0 16px", padding: "12px 14px", borderRadius: 16, background: "rgba(0,0,0,0.12)", fontSize: 14, lineHeight: 1.5 }}>
          <div><span style={{ opacity: 0.6 }}>Subject </span><b>{shown.preview.subject}</b></div>
          <div style={{ opacity: 0.75 }}>{shown.preview.body}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 6, fontWeight: 600 }}>{Ico.clip} {shown.preview.attach}</div>
        </div> : <p className="mute" style={{ margin: "12px 0 20px", fontSize: 16, lineHeight: 1.45 }}>{shown.body}</p>}
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <b style={{ display: "flex", alignItems: "center", gap: 8 }}>Press the side button {Ico.arrow}</b>
          <button className="btn ghost sm" onClick={() => d({ type: "decline" })}>Not now</button>
        </div>
      </div>
      <div className="press-bar" />
    </>}
  </div>;
}

function SoftApproval({ s, d }) {
  const ap = s.approval;
  if (!ap || ap.fire) return null;
  const ag = agentById(s, ap.agentId);
  return <div className="soft" key={ap.id}>
    {ag && <AgentBot agent={ag} size={40} state="wide" />}
    <div style={{ flex: 1 }}><div className="label">Manual mode · {ag ? ag.name : "Agent"}</div><b>{ap.title}</b></div>
    <span className="mute" style={{ fontSize: 13 }}>Press to continue</span>
    <button className="btn ghost sm" onClick={() => d({ type: "decline" })}>Not now</button>
  </div>;
}

/* =========================== App =========================== */
function Device({ children, onPress, want }) {
  const wrap = useRef(null);
  const [scale, setScale] = useState(1), [down, setDown] = useState(false);
  useEffect(() => { const ro = new ResizeObserver(([e]) => setScale(Math.min(1, e.contentRect.width / 904))); ro.observe(wrap.current); return () => ro.disconnect(); }, []);
  const press = () => { setDown(true); onPress(); };
  return <div className="fit" ref={wrap} style={{ height: 600 * scale }}>
    <div className="device" style={{ transform: `scale(${scale})` }}>
      <div className="bezel"><div className="glass"><div className="screen">{children}</div></div></div>
      <button className={"side" + (down ? " down" : "") + (want ? " want" : "")} aria-label="Approve button" onPointerDown={press} onPointerUp={() => setDown(false)} onPointerLeave={() => setDown(false)} />
    </div>
  </div>;
}

function Clock() {
  const [t, setT] = useState(() => new Date());
  useEffect(() => { const id = setInterval(() => setT(new Date()), 15e3); return () => clearInterval(id); }, []);
  return <span className="tnum">{t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>;
}

function App() {
  const [s, d] = useReducer(reducer, null, load);
  const sRef = useRef(s); sRef.current = s;
  useEffect(() => { const id = setInterval(() => d({ type: "tick", now: Date.now() }), 250); return () => clearInterval(id); }, []);
  useEffect(() => { try { localStorage.setItem(STORE, JSON.stringify({ agents: s.agents, notes: s.notes, tasks: s.tasks, activity: s.activity, settings: s.settings })); } catch (e) {} }, [s.agents, s.notes, s.tasks, s.activity, s.settings]);
  useEffect(() => { if (!s.toast) return; const id = setTimeout(() => d({ type: "toast", msg: null }), 2800); return () => clearTimeout(id); }, [s.toast]);

  const press = useCallback(() => { try { navigator.vibrate && navigator.vibrate(18); } catch (e) {} if (sRef.current.approval) d({ type: "approve" }); }, []);
  const startTalk = useCallback(() => d({ type: "talkStart", now: Date.now() }), []);
  const stopTalk = useCallback(() => d({ type: "talkStop", now: Date.now() }), []);
  useEffect(() => {
    const typing = e => e.target.closest && e.target.closest("input, textarea");
    const down = e => {
      if (typing(e)) return;
      if (e.code === "Space") { e.preventDefault(); if (!e.repeat) startTalk(); }
      else if (e.key === "Enter") { e.preventDefault(); press(); }
      else if (e.key === "Escape") d({ type: "back" });
    };
    const up = e => { if (e.code === "Space" && !typing(e)) stopTalk(); };
    window.addEventListener("keydown", down); window.addEventListener("keyup", up);
    return () => { window.removeEventListener("keydown", down); window.removeEventListener("keyup", up); };
  }, []);

  const r = s.route, [base, id] = r.split(":");
  const tab = s.docked ? "dock" : base === "note" ? "notes" : base === "task" ? "tasks" : base === "agent" || base === "create" ? "agents" : base === "suggest" ? "home" : base;
  const fireOn = s.approval && s.approval.fire;
  const needs = s.tasks.some(t => t.status === "held" || t.status === "paused");
  const nav = route => d({ type: "nav", route });
  let screen;
  if (s.docked) screen = <Dock s={s} d={d} />;
  else if (base === "home") screen = <Home s={s} d={d} startTalk={startTalk} stopTalk={stopTalk} />;
  else if (base === "suggest") screen = <Suggest key={r} s={s} d={d} id={id} />;
  else if (base === "task") screen = <TaskView key={r} s={s} d={d} id={id} />;
  else if (base === "notes") screen = <Notes s={s} d={d} />;
  else if (base === "note") screen = <NoteView key={r} s={s} d={d} id={id} />;
  else if (base === "tasks") screen = <Tasks s={s} d={d} />;
  else if (base === "agents") screen = <Agents s={s} d={d} />;
  else if (base === "agent") screen = <AgentView key={r} s={s} d={d} id={id} />;
  else if (base === "create") screen = <Create s={s} d={d} />;
  else if (base === "focus") screen = <Focus s={s} d={d} />;
  else if (base === "settings") screen = <Settings s={s} d={d} />;

  return <div className="page">
    <h1>Device prototype</h1>
    <p>A working build of the docs: dump, note, suggestion, task agents, the approval press, Notes, Tasks, Agents (your main agent makes new ones), Focus, Dock and Settings. The server is simulated in the page and your data stays in this browser.</p>
    <Device onPress={press} want={!!s.approval}>
      <div className="fill" style={{ "--ink": fireOn ? "#000" : "#fff" }}>
        <div className="status"><span style={{ paddingLeft: s.docked ? 0 : 60 }}><Clock /></span>
          <span>{!s.online && "Offline"}{s.docked && "Docked"}{s.focus.running && !s.docked && "Focus"} {s.speed > 1 && "×" + s.speed}<span className={"batt" + (s.docked ? " charge" : "")}><i /></span></span></div>
        {!s.docked && <nav className="rail" aria-label="Apps">
          <button className={tab === "home" ? "on" : ""} onClick={() => nav("home")} aria-label="Home"><Bot size={34} seed={3} state={needs ? "wide" : "idle"} fps={24} /></button>
          <button className={tab === "notes" ? "on" : ""} onClick={() => nav("notes")} aria-label="Notes">{Ico.notes}</button>
          <button className={tab === "tasks" ? "on" : ""} onClick={() => nav("tasks")} aria-label="Tasks">{Ico.tasks}{needs && <i className="badge" />}</button>
          <button className={tab === "agents" ? "on" : ""} onClick={() => nav("agents")} aria-label="Agents">{Ico.agents}</button>
          <button className={tab === "focus" ? "on" : ""} onClick={() => nav("focus")} aria-label="Focus">{Ico.focus}</button>
          <div className="grow" />
          <button className={tab === "settings" ? "on" : ""} onClick={() => nav("settings")} aria-label="Settings">{Ico.settings}</button>
        </nav>}
        <div className={"main" + (s.docked ? " full" : "")}>{screen}</div>
        {s.talk && <TalkOverlay s={s} />}
        <SoftApproval s={s} d={d} />
        <FireOverlay s={s} d={d} />
        {s.toast && <div className="toast" key={s.toast}>{s.toast}</div>}
      </div>
    </Device>
    <div className="panel">
      <button className="pbtn" onPointerDown={e => { e.currentTarget.setPointerCapture(e.pointerId); startTalk(); }} onPointerUp={stopTalk} onPointerCancel={stopTalk}>Hold to talk</button>
      <button className="pbtn" onClick={press}>Approval press</button>
      <button className="pbtn" aria-pressed={s.docked} onClick={() => d({ type: "dock", value: !s.docked })}>{s.docked ? "Take off dock" : "Put on dock"}</button>
      <button className="pbtn" aria-pressed={!s.online} onClick={() => d({ type: "online", value: !s.online })}>{s.online ? "Go offline" : "Go online"}</button>
      <button className="pbtn" aria-pressed={!s.settings.devices.find(x => x.id === "mac").online} onClick={() => d({ type: "device", id: "mac" })}>MacBook {s.settings.devices.find(x => x.id === "mac").online ? "online" : "offline"}</button>
      <button className="pbtn" aria-pressed={s.speed > 1} onClick={() => d({ type: "speed", value: s.speed > 1 ? 1 : 60 })}>Time ×{s.speed > 1 ? 60 : 1}</button>
      <button className="pbtn" onClick={() => d({ type: "reset" })}>Reset</button>
    </div>
    <div className="keys"><kbd>Space</kbd> hold to talk · <kbd>Enter</kbd> approval press · <kbd>Esc</kbd> back</div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
